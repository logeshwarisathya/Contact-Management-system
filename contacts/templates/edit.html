{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .backgroundimg {
            height: 100vh;
            width: 100%;
            background-image: url("{% static 'images/bcimg.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;

            color: #fff;
        }
            form {
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }
        .form-group{
            width: 100%;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
            margin-top: 5px;
        }

        input:focus, textarea:focus {
            border: 2px solid #ff9800;
        }

        label {
            font-weight: bold;
        }
        button{
        width: 110px;
        height: 40px;
        border-radius: 30px;
        background-color: chocolate;
    }
    </style>
</head>
<body>
   
    <div class="backgroundimg">
   <h2>Edit Contact</h2>
        <form method="POST">
        {% csrf_token %}
            <div class="form-group">
                {{ form.first_name }}
            </div>

            <div class="form-group">
                {{ form.last_name }}
            </div>

            <div class="form-group">
                {{ form.email }}
            </div>

            <div class="form-group">
                {{ form.phone }}
            </div><br>
       <center> <button type="submit">Update</button></center>
        </form>

</div>
   
</body>
</html>
